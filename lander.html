<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ORCA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #003366;
      color: white;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }

    main {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(7rem, 25vw, 24rem);
      font-weight: 400;
      line-height: 0.8;
      letter-spacing: -0.03em;

      color: white;

      -webkit-text-stroke: 5px #0000ff;
      paint-order: stroke fill;

      user-select: none;
    }

    .subtitle {
      margin-top: 40px;
      font-size: clamp(1rem, 1.6vw, 1.4rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .issue {
      margin-top: 12px;
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    @media (max-width: 600px) {
      h1 {
        -webkit-text-stroke: 3px #0000ff;
      }

      .subtitle {
        margin-top: 28px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>ORCA</h1>

    <p class="subtitle">
      Deep dives, London.
    </p>

    <p class="issue">
      001 — COMING SOON
    </p>
  </main>
</body>
</html>
